AWSTemplateFormatVersion: '2010-09-09'

Description: >
  AWS infrastructure for the Data Lakehouse.

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: >
      Target deployment environment. Used to identify the
      environment associated with the Bronze bucket.

  ArchiveAccessDays:
    Type: Number
    Default: 90
    MinValue: 90
    Description: >
      Number of days of inactivity before objects are moved
      to the Intelligent-Tiering Archive Access tier.

  DeepArchiveAccessDays:
    Type: Number
    Default: 180
    MinValue: 180
    Description: >
      Number of days of inactivity before objects are moved
      to the Intelligent-Tiering Deep Archive Access tier.

  NoncurrentVersionExpirationDays:
    Type: Number
    Default: 90
    Description: >
      Number of days after which noncurrent object versions
      are automatically deleted.

  VpcCidr:
    Type: String
    Default: 10.10.0.0/16
    Description: IPv4 range used by the crawler VPC.
  
  PublicSubnetCidr:
    Type: String
    Default: 10.10.1.0/24
    Description: IPv4 range for the EC2 public subnet

  AllowedSshCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])$'
    Description: Public IPv4 address allowed to connect to the EC2 through SSH.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >
      Amazon Linux 2023 ARM64, automatically resolved to the latest available
      version

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
    Description: ARM instance type.

Resources:

  CrawlerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-crawler-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CrawlerVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CrawlerVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-crawler-public-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CrawlerVpc

  DefaultInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CrawlerVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt BronzeBucket.Arn
              - !Sub '${BronzeBucket.Arn}/*'
          - Sid: AllowAmazonLinux2023Packages
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-de612dc2/*'


  BronzeBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName: !Sub "lakehouse-bronze-${EnvironmentName}-${AWS::AccountId}"

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      IntelligentTieringConfigurations:

        - Id: EntireBucketIntelligentTiering
          Status: Enabled

          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: !Ref ArchiveAccessDays

            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: !Ref DeepArchiveAccessDays

      LifecycleConfiguration:

        Rules:

          - Id: ExpireNoncurrentVersions
            Status: Enabled

            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref NoncurrentVersionExpirationDays

          - Id: AbortIncompleteMultipartUploads
            Status: Enabled

            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

      Tags:

        - Key: Layer
          Value: Bronze

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: Project
          Value: DataLakehouseMedallion

        - Key: ManagedBy
          Value: CloudFormation

        - Key: DataSource
          Value: ERP

  BronzeGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "bronze_${EnvironmentName}"
        Description: Glue database for the Bronze layer of the Data Lakehouse.
  

  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      Policies:

        - PolicyName: CrawlerS3AndGlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Bronze bucket access for the custom crawler
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt BronzeBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${BronzeBucket.Arn}/*'

              # Existing Glue permissions used by the crawler
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetPartitions
                  - glue:GetPartition
                  - glue:CreatePartition
                Resource: '*'


        - PolicyName: SilverLoaderAthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # Athena query execution and monitoring
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: '*'

              # Read Glue metadata for Bronze and Silver
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                Resource: '*'

              # Read Bronze data
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt BronzeBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${BronzeBucket.Arn}/*'

              # Read and write Iceberg data in Silver
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt SilverBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SilverBucket.Arn}/*'

              # Store and retrieve Athena query results
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt AthenaResultsBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${AthenaResultsBucket.Arn}/*'

  CrawlerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CrawlerRole

  CrawlerKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-crawler-key'
      KeyType: ed25519
      KeyFormat: pem

  CrawlerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access only from AllowedSshCidr.
      VpcId: !Ref CrawlerVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
      # Outbound access is needed for operating-system/npm updates. S3 access
      # follows the gateway endpoint route and does not require a NAT Gateway.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  CrawlerEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref CrawlerKeyPair
      IamInstanceProfile: !Ref CrawlerInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref CrawlerSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-custom-crawler'
        - Key: Project
          Value: DataLakehouseMedallion
        - Key: Environment
          Value: !Ref EnvironmentName

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub athena-results-${EnvironmentName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAthenaResults
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Purpose
          Value: Athena-Query-Results
        - Key: Environment
          Value: !Ref EnvironmentName

  SilverBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketName: !Sub "lakehouse-silver-${EnvironmentName}-${AWS::AccountId}"

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:

          - Id: AbortIncompleteMultipartUploads
            Status: Enabled

            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

      Tags:

        - Key: Layer
          Value: Silver

        - Key: Environment
          Value: !Ref EnvironmentName

        - Key: Project
          Value: DataLakehouseMedallion

        - Key: ManagedBy
          Value: CloudFormation

  SilverGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "silver_${EnvironmentName}"
        Description: Glue database for the Silver layer of the Data Lakehouse.
    

Outputs:

  BronzeBucketName:
    Description: Name of the Bronze S3 bucket
    Value: !Ref BronzeBucket

    Export:
      Name: !Sub "${EnvironmentName}-BronzeBucketName"

  BronzeBucketArn:
    Description: ARN of the Bronze S3 bucket
    Value: !GetAtt BronzeBucket.Arn

    Export:
      Name: !Sub "${EnvironmentName}-BronzeBucketArn"

  BronzeBucketDomainName:
    Description: Regional domain name of the Bronze bucket
    Value: !GetAtt BronzeBucket.RegionalDomainName

  GlueDatabaseName:
    Value: !Ref BronzeGlueDatabase

  CrawlerInstanceId:
    Value: !Ref CrawlerEC2

  CrawlerPublicIp:
    Description: SSH with ec2-user only from the AllowedSshCidr address.
    Value: !GetAtt CrawlerEC2.PublicIp

  KeyPairId:
    Description: Retrieve the private key from SSM at /ec2/keypair/<this-id> immediately after deployment.
    Value: !GetAtt CrawlerKeyPair.KeyPairId

  AthenaResultsBucketName:
    Description: Name of the S3 bucket used for Athena query results
    Value: !Ref AthenaResultsBucket
  
  SilverBucketName:
    Description: Name of the Silver S3 bucket
    Value: !Ref SilverBucket

    Export:
      Name: !Sub "${EnvironmentName}-SilverBucketName"

  SilverBucketArn:
    Description: ARN of the Silver S3 bucket
    Value: !GetAtt SilverBucket.Arn

    Export:
      Name: !Sub "${EnvironmentName}-SilverBucketArn"

  SilverGlueDatabaseName:
    Description: Name of the Glue database for the Silver layer
    Value: !Ref SilverGlueDatabase
